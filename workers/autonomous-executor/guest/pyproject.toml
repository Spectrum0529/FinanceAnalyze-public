[project]
name = "finance-research-guest-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["pyqlib @ https://github.com/microsoft/qlib/archive/54355232463878d2eebb91fe0ee5fa7fa1f5976c.tar.gz"]

# The pinned archive has no .git SCM metadata. Preserve its release version.
[tool.uv.extra-build-variables]
pyqlib = { SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYQLIB = "0.9.8" }
