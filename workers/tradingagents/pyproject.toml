[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-predictor"
version = "0.1.0"
description = "Engineering shell for the FinanceAnalyze research project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tradingagents==0.7.0",
    "exchange-calendars==4.13.2",
    "fastapi==0.135.1",
    "httpx==0.28.1",
    "numpy==2.5.3",
    "pyarrow==21.0.0",
    "tzdata==2026.5",
    "uvicorn==0.41.0",
    "websockets==15.0.1",
    "yfinance==1.7.0",
    "akshare==1.19.3+guard1",
]

[project.scripts]
predictor = "predictor.cli:main"
finance-platform = "finance_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Match the established project build backend for the legacy jsonpath source build.
build-constraint-dependencies = ["setuptools==80.9.0"]
constraint-dependencies = ["akracer==0.0.14", "akshare==1.19.3+guard1", "annotated-doc==0.0.5", "annotated-types==0.8.0", "anyio==4.15.1", "beautifulsoup4==4.15.0", "certifi==2026.7.22", "cffi==2.1.1", "charset-normalizer==3.5.2", "click==8.5.0", "colorama==0.4.6", "curl-cffi==0.16.3", "decorator==5.3.1", "et-xmlfile==2.0.0", "exchange-calendars==4.13.2", "fastapi==0.135.1", "h11==0.16.0", "html5lib==1.1", "httpcore==1.0.9", "httpx==0.28.1", "idna==3.20", "jsonpath==0.82.2", "korean-lunar-calendar==0.4.0", "lxml==6.1.3", "mini-racer==0.14.1", "multitasking==0.0.13", "numpy==2.5.3", "openpyxl==3.1.5", "packaging==26.3", "pandas==3.0.6", "peewee==4.5.3", "platformdirs==4.13.4", "protobuf==7.36.2", "py-mini-racer==0.6.0", "pyarrow==21.0.0", "pycparser==3.11", "pydantic-core==2.50.0", "pydantic==2.14.0", "pyluach==2.3.0", "python-dateutil==2.9.0.post0", "pytz==2026.5", "pyyaml==6.0.3", "requests==2.34.2", "six==1.17.0", "soupsieve==3.0.3", "starlette==1.7.0", "tabulate==0.10.0", "toolz==1.2.0", "tqdm==4.70.1", "typing-extensions==4.16.0", "typing-inspection==0.4.4", "tzdata==2026.5", "urllib3==2.8.0", "uvicorn==0.41.0", "webencodings==0.6.1", "websockets==15.0.1", "xlrd==2.0.2", "yfinance==1.7.0"]
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
akshare = { path = "vendor/wheels/akshare-1.19.3+guard1-py3-none-any.whl" }
tradingagents = { path = "vendor/wheels/tradingagents-0.7.0-py3-none-any.whl" }
